<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="index.css">

    <title>Basketball Scoreboard</title>
</head>
<body>
    <section id="scoreboard">
        <div class="container">
            <div id="home">
                <h3>HOME</h3>
                <span class="points" id="home-points">
                    0
                </span>
                <div class="buttons">
                    <button onclick="maisUm()">+1</button>
                    <button onclick="maisDois()">+2</button>
                    <button onclick="maisTres()">+3</button>
                </div>
            </div>
            <div id="guest" id="guest-points">
                <h3>GUEST</h3>
                <span class="points">
                    0
                </span>
                <div class="buttons">
                    <button onclick="maisUm()">+1</button>
                    <button onclick="maisDois()">+2</button>
                    <button onclick="maisTres()">+3</button>
                </div>
            </div>
        </div>

        <button class="btn-new-game" onclick="newGame()">NEW GAME</button>
    </section>

    <script src="index.js"></script>
</body>
</html>
