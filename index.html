<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="index.css">

    <title>Basketball Scoreboard</title>
</head>
<body>
    <section id="scoreboards">
        <div class="container">
            <div class="scoreboard">
                <h3>HOME</h3>
                <span class="points">0</span>
                <div class="buttons">
                    <button onclick="plusOne(this)">+1</button>
                    <button onclick="plusTwo(this)">+2</button>
                    <button onclick="plusThree(this)">+3</button>
                </div>
            </div>
            <div class="scoreboard">
                <h3>GUEST</h3>
                <span class="points">0</span>
                <div class="buttons">
                    <button onclick="plusOne(this)">+1</button>
                    <button onclick="plusTwo(this)">+2</button>
                    <button onclick="plusThree(this)">+3</button>
                </div>
            </div>
        </div>
        <p>MATCHES: <span id="matchesText"></span></p>
        <div class="game-buttons">
            <button class="btn-save-match" onclick="saveMatch()">SAVE MATCH</button>
            <button class="btn-new-game" onclick="newGame()">NEW GAME</button>
        </div>
    </section>

    <script src="index.js"></script>
</body>
</html>
